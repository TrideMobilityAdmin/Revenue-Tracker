server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - React Router handles client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container/service.
    # In docker-compose this resolves to the "backend" service name.
    # On AWS behind an ALB you may instead point the frontend directly at
    # the API's own domain/target group and remove this block.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
